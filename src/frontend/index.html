<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MaydayMama</title>
    <meta name="theme-color" content="#faf7f2" />
    <script>
      // Runs before the first paint so a stored theme never flashes the other one.
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
    <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens/account.css" />
    <link rel="stylesheet" href="css/screens/group.css" />
    <link rel="stylesheet" href="css/screens/wellbeing.css" />
    <link rel="stylesheet" href="css/screens/loved-ones.css" />
    <link rel="stylesheet" href="css/screens/tasks.css" />
    <link rel="stylesheet" href="css/screens/help.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#screen">Przejdź do treści</a>
    <!-- The mock notice is inserted here by js/app.js when mock mode is on. -->
    <div id="notice-slot"></div>
    <header class="site-header">
      <div class="site-header__inner" id="header-inner">
        <a class="brand" href="#/">MaydayMama</a>
      </div>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <noscript>
      <p class="screen">MaydayMama wymaga włączonej obsługi JavaScript.</p>
    </noscript>
  </body>
</html>
