services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Wins over an empty DATABASE_PATH in .env, so the file always lands on the volume.
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - db:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  caddy_data:
  caddy_config:
